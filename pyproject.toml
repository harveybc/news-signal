[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-signal"
version = "0.1.0"
description = "Auditable local Laya news classification for shadow trading research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
laya = ["laya @ git+https://github.com/NandhaKishorM/laya.git@1e28ac20c0896b1c37a744cd11f740eb98f8b178"]
test = ["pytest>=8"]

[project.scripts]
news-signal = "news_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
